# Stack para Portainer. Servico HTTP proprio (porta 3212), chamado pelo BFF
# via REST (ver bff/.../HttpReportJobRunner.java e AUTOMATION_BASE_URL).
#
# IMPORTANTE - login SSO manual: este servico roda headless (sem display) e
# NAO consegue completar o login interativo da Matrix sozinho quando a
# sessao expira. Para reautenticar, use o botao "Reautenticar" no frontend
# (POST /reauth/start neste servico) - ele abre um Chromium HEADED num
# display virtual e expõe a tela via noVNC (porta 6080), direto no browser
# do usuario. Nao precisa de SSH nem de copiar volume manualmente.
services:
  automation:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3212:3212"
      # noVNC do fluxo de reautenticacao remota (ver src/reauth.js) -
      # exposto so enquanto POST /reauth/start estiver ativo.
      - "6080:6080"
    environment:
      PORT: "3212"
      DATA_HUB_TOKEN: ${DATA_HUB_TOKEN}
      MATRIX_API_LOGIN: ${MATRIX_API_LOGIN}
      MATRIX_API_SENHA: ${MATRIX_API_SENHA}
    volumes:
      - automation-auth:/app/.auth
      - automation-downloads:/app/downloads
    restart: unless-stopped

volumes:
  automation-auth:
  automation-downloads:
